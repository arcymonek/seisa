# Tool configuration only (not a package): `ruff check backend scripts tests` and `python3 -m pytest -q`
# (development tools from requirements-dev.txt, not dependencies of the application).
[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [".venv", "reports"]
# The git hooks have no .py extension (git needs the exact name), so ruff would skip them without this.
extend-include = ["scripts/hooks/pre-commit", "scripts/hooks/commit-msg"]

[tool.ruff.lint]
select = ["F", "E", "W", "B", "UP", "SIM", "I", "PIE", "RET", "C4", "PERF", "RUF", "ASYNC"]

# E501: long lines are LLM prompt strings and catalog-like text; UP017/PERF401/PERF402: style-only, not worth churn;
# SIM117: the nested `async with` around the OpenRouter stream is clearer than one combined statement.
ignore = ["E501", "UP017", "PERF401", "PERF402", "SIM117"]

[tool.ruff.lint.per-file-ignores]
# dump_facts.py imports backend modules only after sys.path points at the requested checkout.
"scripts/dump_facts.py" = ["E402"]

[tool.pytest.ini_options]
# `slow`: the tests that build throw-away git repositories (tests/test_pre_commit_hook.py) or start child processes
# (tests/test_parser_limits.py); `pytest -m "not slow"` skips them.
markers = ["slow: builds throw-away git repositories or child processes (hook tests, parser time limits), about two minutes in total"]
# pythonpath makes `import backend...` work without sys.path tricks in the tests.
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
# Used by the informational coverage report in CI (`coverage run -p ...`); the frontend has no coverage tooling.
source = ["backend"]
