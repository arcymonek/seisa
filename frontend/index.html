<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seisa 2.0.91</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>
      <img class="logo-img" src="/logo.png" alt="Seisa" width="56" height="56">
      <span class="title-text"><span class="brand-name">Seisa</span> <small>2.0.91</small></span>
    </h1>
    <div class="subtitle" data-i18n="app.subtitle">Local IP reputation analysis, URL scans, DMARC reports and AbuseIPDB reports</div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="lookup">IP</button>
    <button class="tab-btn" data-tab="urlscan">URLScan</button>
    <button class="tab-btn" data-tab="dmarc">DMARC</button>
    <button class="tab-btn" data-tab="email">Email</button>
    <button class="tab-btn" data-tab="report">AbuseIPDB</button>
    <button class="tab-btn" data-tab="history" data-i18n="tab.history">History</button>
    <button class="tab-btn" data-tab="logs" data-i18n="tab.logs">Logs</button>
    <button class="tab-btn info-btn" data-tab="about" data-i18n-attr="title:tab.info;aria-label:tab.info" title="Info" aria-label="Info"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="6" r="0.6"/><path d="M12 11v7"/></svg></button>
  </nav>

  <main id="panels">
    <section id="panel-lookup" class="panel active"></section>
    <section id="panel-urlscan" class="panel"></section>
    <section id="panel-dmarc" class="panel"></section>
    <section id="panel-email" class="panel"></section>
    <section id="panel-report" class="panel"></section>
    <section id="panel-history" class="panel"></section>
    <section id="panel-logs" class="panel"></section>
    <section id="panel-about" class="panel"></section>
  </main>

  <footer>Seisa 2.0.91 | Arkadiusz Polak | <span class="lang-switch" id="lang-switch"></span></footer>
</div>

<script src="/vendor/marked.min.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
