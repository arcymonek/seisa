<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seisa 2.4.0</title>
<meta name="seisa-release-date" content="2026-10-12">
<link rel="icon" href="/favicon.ico" sizes="any">
<script src="/theme-init.js"></script>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/api/themes.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>
      <img class="logo-img" data-logo="dark" src="/logo.png" alt="Seisa" width="56" height="56">
      <span class="logo-img" data-logo="light" role="img" aria-label="Seisa"></span>
      <span class="title-text"><span class="brand-name">Seisa</span> <small>2.4.0</small></span>
    </h1>
    <div class="subtitle" data-i18n="app.subtitle">Local tool for analysing IPs, URLs, DMARC reports and e-mails, and for reporting to AbuseIPDB.</div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="lookup">IP</button>
    <button class="tab-btn" data-tab="urlscan">URLScan</button>
    <button class="tab-btn" data-tab="dmarc">DMARC</button>
    <button class="tab-btn" data-tab="email">Email</button>
    <button class="tab-btn" data-tab="report">AbuseIPDB</button>
    <button class="tab-btn" data-tab="history" data-i18n="tab.history">History</button>
    <button class="tab-btn" data-tab="logs" data-i18n="tab.logs">Logs</button>
    <button class="tab-btn info-btn" data-tab="about" data-i18n-attr="title:tab.info;aria-label:tab.info" title="Info" aria-label="Info"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="14" cy="6" r="2"/><path d="M4 6h8M16 6h4"/><circle cx="8" cy="12" r="2"/><path d="M4 12h2M10 12h10"/><circle cx="17" cy="18" r="2"/><path d="M4 18h11M19 18h1"/></svg></button>
  </nav>

  <main id="panels">
    <section id="panel-lookup" class="panel active"></section>
    <section id="panel-urlscan" class="panel"></section>
    <section id="panel-dmarc" class="panel"></section>
    <section id="panel-email" class="panel"></section>
    <section id="panel-report" class="panel"></section>
    <section id="panel-history" class="panel"></section>
    <section id="panel-logs" class="panel"></section>
    <section id="panel-about" class="panel"></section>
  </main>

  <footer>Seisa 2.4.0 | Arkadiusz Polak | <button type="button" id="footer-shutdown" class="footer-link" data-i18n="app.shutdown_button"></button></footer>
</div>

<script src="/vendor/marked.min.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
