blank_issues_enabled: false
contact_links:
  - name: Report a vulnerability privately
    url: https://github.com/arcymonek/seisa/security/advisories/new
    about: Security problems must not be posted as a public issue. Use private vulnerability reporting (see SECURITY.md).
  - name: Ask a question
    url: https://github.com/arcymonek/seisa/discussions/categories/q-a
    about: Ask how something works or how to use Seisa. Use an issue only for a bug or a feature idea.
  - name: Discuss an idea
    url: https://github.com/arcymonek/seisa/discussions/categories/ideas
    about: Talk through an idea that is not yet concrete enough for a feature issue.
