name: ci

# Pull requests from forks run here with read-only rights and no secrets. Never switch to `pull_request_target`:
# it runs with write rights and secrets, and checking out the fork's code in it would hand both to that code.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned, not "ubuntu-latest": GitHub moves that label to Ubuntu 26.04 from 2026-10-19, and the tools the checks use
    # should change when we decide, not on GitHub's schedule.
    runs-on: ubuntu-24.04
    # A run takes about a minute; the default limit is 360 minutes, so a hung job would hold a runner for 6 hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.x"]
    steps:
      # Actions are pinned to a full commit SHA (the tag is only a label that can be moved); both run on Node 24.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0   # the version rule below compares the pull request with the merge-base on main
          persist-credentials: false   # no step pushes; the token is not left in .git/config for the code under test
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: ruff check backend scripts tests
      - run: python -m pytest -q
      - run: python scripts/api_harness.py
      - run: python scripts/check_i18n.py --strict
      - run: python scripts/dump_facts.py > /dev/null
      - name: Version rule and added-line rules for the whole branch (own pull requests)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/hooks/pre-commit --range "origin/$BASE_REF"
      # A contributor does not bump the version (CONTRIBUTING.md): the maintainer adds it after review and runs the
      # full --range then. The added lines (long dash, privacy scan) are checked here, a fork has no hooks.
      - name: Added-line rules for the whole branch (pull requests from forks)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/hooks/pre-commit --range "origin/$BASE_REF" --no-version-rule
